name: Deploy Development Branch

on:
  push:
    branches:
      - development

concurrency:
  group: deploy-development
  cancel-in-progress: true

jobs:
  development-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo, simplexml
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      # - name: Run testsff
      ###   env:
      #     APP_ENV: testing
      #     DB_CONNECTION: sqlite
      #     DB_DATABASE: ":memory:"
      #   run: php artisan test

  deploy:
    needs: development-deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            git config --global --add safe.directory "/var/www/development/bagisto-shell"
            cd "/var/www/development/bagisto-shell"
            git reset --hard origin/development
            git clean -fd
            git pull origin development
            bash .scripts/laravel.sh